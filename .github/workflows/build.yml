name: Build and Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  BUILD_TYPE: Release
  QT_VERSION: '6.7.3'

jobs:
  # ============================================================================
  # Linux Build
  # ============================================================================
  linux-build:
    name: Linux (Ubuntu 22.04)
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build g++ \
            libgl-dev libglu1-mesa-dev \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libssl-dev libdbus-1-dev \
            libegl-dev

      - name: Install Qt ${{ env.QT_VERSION }}
        run: |
          pip install aqtinstall --quiet
          python3 -m aqt install-qt linux desktop ${{ env.QT_VERSION }} linux_gcc_64 \
            --outputdir $HOME/Qt
          echo "$HOME/Qt/${{ env.QT_VERSION }}/gcc_64/bin" >> $GITHUB_PATH
          echo "CMAKE_PREFIX_PATH=$HOME/Qt/${{ env.QT_VERSION }}/gcc_64" >> $GITHUB_ENV

      - name: Configure
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DBUILD_QT6_GUI=ON

      - name: Build
        run: cmake --build build --parallel $(nproc)

      - name: Test
        run: cd build && ctest --output-on-failure || true

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: linux-build
          path: build/bin/

  # ============================================================================
  # Windows Build (MSVC 2022)
  # ============================================================================
  windows-build:
    name: Windows (VS 2022)
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4

      - name: Install Qt 6.8.2
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.2'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          cache: true
          cache-key-prefix: qt-win-6.8.2

      - name: Configure
        shell: pwsh
        run: |
          cmake -B build `
            -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} `
            -DBUILD_QT6_GUI=ON `
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded

      - name: Build
        shell: pwsh
        run: cmake --build build --config ${{ env.BUILD_TYPE }} --parallel

      - name: Deploy Qt6 Runtime with windeployqt
        shell: pwsh
        run: |
          # Create deployment directory
          $deployDir = "build\bin\deploy"
          if (Test-Path $deployDir) { Remove-Item -Recurse -Force $deployDir }
          New-Item -ItemType Directory -Path $deployDir | Out-Null
          
          # Copy the main executable
          Copy-Item "build\bin\Release\ReDroidCPP.exe" -Destination $deployDir
          
          # Run windeployqt to bundle all Qt6 DLLs and plugins
          $env:QT_PLUGIN_PATH = "$env:QT_ROOT_DIR\plugins"
          & "$env:QT_ROOT_DIR\bin\windeployqt.exe" `
            --dir $deployDir `
            --no-translations `
            --no-system-d3d-compiler `
            --no-compiler-runtime `
            --no-opengl-sw `
            "build\bin\Release\ReDroidCPP.exe"

          # ---------------------------------------------------------------
          # Explicitly copy VC++ 2022 runtime DLLs from MSVC redist folder
          # windeployqt does NOT reliably copy these on CI environments
          # ---------------------------------------------------------------
          $vswhere = "C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath  = & $vswhere -latest -products * -requires Microsoft.VisualCpp.Redist.14.Latest -property installationPath
          if (-not $vsPath) {
            $vsPath = "C:\Program Files\Microsoft Visual Studio\2022\Enterprise"
          }
          $crtDir = Get-ChildItem "$vsPath\VC\Redist\MSVC\*\x64\Microsoft.VC143.CRT" `
                      -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName
          if (-not $crtDir) {
            # Fallback: search all VS editions
            $crtDir = Get-ChildItem "C:\Program Files\Microsoft Visual Studio\2022\*\VC\Redist\MSVC\*\x64\Microsoft.VC143.CRT" `
                        -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName
          }
          Write-Host "VC++ CRT directory: $crtDir"

          $vcDlls = @(
            "msvcp140.dll",
            "msvcp140_1.dll",
            "msvcp140_2.dll",
            "vcruntime140.dll",
            "vcruntime140_1.dll",
            "concrt140.dll"
          )
          foreach ($dll in $vcDlls) {
            $src = Join-Path $crtDir $dll
            if (Test-Path $src) {
              Copy-Item $src $deployDir
              Write-Host "Copied runtime DLL: $dll"
            } else {
              Write-Warning "NOT FOUND: $dll at $src"
            }
          }
          
          # CRITICAL FIX: Bundle MSVC Runtime DLLs for Qt6 DLLs
          # Qt6 DLLs require MSVC runtime even when --no-compiler-runtime is used
          Write-Host "Bundling MSVC Runtime DLLs for Qt6 compatibility..."
          
          # Copy MSVC Runtime DLLs from Windows System32
          $msvcDlls = @(
              "VCRUNTIME140.dll",
              "VCRUNTIME140_1.dll",
              "MSVCP140.dll",
              "MSVCP140_1.dll",
              "MSVCP140_2.dll",
              "VCRUNTIME140_1.dll"
          )
          
          foreach ($dll in $msvcDlls) {
              $src = "C:\Windows\System32\$dll"
              if (Test-Path $src) {
                  Copy-Item $src -Destination $deployDir -ErrorAction SilentlyContinue
                  Write-Host "  [OK] $dll"
              }
          }
          
          # Also check for VS2022 redistributables in alternate locations
          $vsDllPaths = @(
              "C:\Program Files\Microsoft Visual Studio\2022\Community\VC\Redist\MSVC\*\x64\Microsoft.VC143.CRT\VCRUNTIME140.dll",
              "C:\Program Files\Microsoft Visual Studio\2022\BuildTools\VC\Redist\MSVC\*\x64\Microsoft.VC143.CRT\VCRUNTIME140.dll",
              "C:\Program Files (x86)\Microsoft Visual Studio\2022\BuildTools\VC\Redist\MSVC\*\x64\Microsoft.VC143.CRT\VCRUNTIME140.dll"
          )
          
          foreach ($pattern in $vsDllPaths) {
              $files = Get-ChildItem -Path $pattern -ErrorAction SilentlyContinue
              if ($files) {
                  Copy-Item $files[0].FullName -Destination $deployDir -ErrorAction SilentlyContinue
                  Copy-Item $files[0].FullName.Replace("VCRUNTIME140.dll","MSVCP140.dll") -Destination $deployDir -ErrorAction SilentlyContinue
                  Copy-Item $files[0].FullName.Replace("VCRUNTIME140.dll","MSVCP140_1.dll") -Destination $deployDir -ErrorAction SilentlyContinue
                  Copy-Item $files[0].FullName.Replace("VCRUNTIME140.dll","VCRUNTIME140_1.dll") -Destination $deployDir -ErrorAction SilentlyContinue
                  break
              }
          }
          
          # Verify deployment
          Write-Host ""
          Write-Host "Deployed files:"
          Get-ChildItem -Recurse $deployDir | Select-Object FullName, Length

      - name: Test
        shell: pwsh
        run: cd build; ctest -C ${{ env.BUILD_TYPE }} --output-on-failure; exit 0

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: windows-exe
          path: build/bin/deploy/

  # ============================================================================
  # Code Quality
  # ============================================================================
  code-quality:
    name: Code Quality
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get install -y -qq cppcheck
          cppcheck --std=c++17 --suppress=missingInclude \
            --error-exitcode=0 src/ include/ 2>&1 | tail -10 || true

  # ============================================================================
  # Security Scan
  # ============================================================================
  security-scan:
    name: Security Scan
    runs-on: ubuntu-22.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install and run Trivy
        run: |
          sudo apt-get install -y -qq wget gnupg
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key \
            | gpg --dearmor | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] \
            https://aquasecurity.github.io/trivy-repo/deb generic main" \
            | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update -qq && sudo apt-get install -y trivy
          trivy fs . --severity HIGH,CRITICAL --exit-code 0 \
            --no-progress --timeout 5m || true

