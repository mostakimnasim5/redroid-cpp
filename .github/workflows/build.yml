name: Build and Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  BUILD_TYPE: Release
  QT_VERSION: '6.7.3'

jobs:
  # ============================================================================
  # Linux Build
  # ============================================================================
  linux-build:
    name: Linux (Ubuntu 22.04)
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build g++ \
            libgl-dev libglu1-mesa-dev \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libssl-dev libdbus-1-dev \
            libegl-dev

      - name: Install Qt ${{ env.QT_VERSION }}
        run: |
          pip install aqtinstall --quiet
          python3 -m aqt install-qt linux desktop ${{ env.QT_VERSION }} linux_gcc_64 \
            --outputdir $HOME/Qt
          echo "$HOME/Qt/${{ env.QT_VERSION }}/gcc_64/bin" >> $GITHUB_PATH
          echo "CMAKE_PREFIX_PATH=$HOME/Qt/${{ env.QT_VERSION }}/gcc_64" >> $GITHUB_ENV

      - name: Configure CMake
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DBUILD_QT6_GUI=ON

      - name: Build project
        run: cmake --build build --parallel $(nproc)

      - name: Run tests
        run: cd build && ctest --output-on-failure || true

      - name: Bundle scrcpy-server (Linux)
        run: |
          # Fetch latest scrcpy release tag
          SCRCPY_VERSION=$(curl -s \
            https://api.github.com/repos/Genymobile/scrcpy/releases/latest \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['tag_name'])" \
            2>/dev/null || echo "v4.1")
          echo "scrcpy version: $SCRCPY_VERSION"

          # Download linux release zip
          SCRCPY_URL="https://github.com/Genymobile/scrcpy/releases/download/${SCRCPY_VERSION}/scrcpy-linux-x86_64-${SCRCPY_VERSION}.tar.gz"
          curl -fsSL "$SCRCPY_URL" -o /tmp/scrcpy.tar.gz || {
            echo "Linux tarball not found, trying zip..."
            SCRCPY_URL="https://github.com/Genymobile/scrcpy/releases/download/${SCRCPY_VERSION}/scrcpy-linux-x86_64-${SCRCPY_VERSION}.zip"
            curl -fsSL "$SCRCPY_URL" -o /tmp/scrcpy.zip
            mkdir -p /tmp/scrcpy
            unzip -q /tmp/scrcpy.zip -d /tmp/scrcpy
            # Copy scrcpy-server to build output
            SSERVER=$(find /tmp/scrcpy -name "scrcpy-server" -type f | head -1)
            if [ -n "$SSERVER" ]; then
              cp "$SSERVER" build/bin/scrcpy-server
              echo "[OK] scrcpy-server bundled from zip ($SCRCPY_VERSION)"
            else
              echo "[WARN] scrcpy-server not found in zip"
            fi
            exit 0
          }
          mkdir -p /tmp/scrcpy
          tar -xzf /tmp/scrcpy.tar.gz -C /tmp/scrcpy
          SSERVER=$(find /tmp/scrcpy -name "scrcpy-server" -type f | head -1)
          if [ -n "$SSERVER" ]; then
            cp "$SSERVER" build/bin/scrcpy-server
            chmod +x build/bin/scrcpy-server
            echo "[OK] scrcpy-server bundled ($SCRCPY_VERSION)"
          else
            echo "[WARN] scrcpy-server not found in tarball"
          fi

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: linux-build
          path: build/bin/

  # ============================================================================
  # Windows Build (MSVC 2022)
  # ============================================================================
  windows-build:
    name: Windows (VS 2022)
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Qt 6.8.2
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.2'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          cache: true
          cache-key-prefix: qt-win-6.8.2

      - name: Configure CMake
        shell: pwsh
        run: |
          cmake -B build `
            -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_BUILD_TYPE=Release `
            -DBUILD_QT6_GUI=ON `
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded

      - name: Build project
        shell: pwsh
        run: cmake --build build --config Release --parallel

      - name: Deploy Qt6 Runtime with windeployqt
        shell: pwsh
        run: |
          Write-Host "=== Qt6 Deployment Starting ==="
          Write-Host "Qt Root Dir: $env:QT_ROOT_DIR"

          # Validate Qt installation
          if (-not $env:QT_ROOT_DIR -or -not (Test-Path "$env:QT_ROOT_DIR\bin\windeployqt.exe")) {
            # Try to find Qt manually
            $qtSearch = Get-ChildItem "C:\Qt\*\msvc2022_64\bin\windeployqt.exe" `
                          -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($qtSearch) {
              $env:QT_ROOT_DIR = Split-Path (Split-Path $qtSearch.FullName)
              Write-Host "Found Qt at: $env:QT_ROOT_DIR"
            } else {
              Write-Error "Qt installation not found!"
              exit 1
            }
          }

          # Create deploy directory
          $deployDir = "build\bin\deploy"
          if (Test-Path $deployDir) { Remove-Item -Recurse -Force $deployDir }
          New-Item -ItemType Directory -Path $deployDir | Out-Null

          # Copy exe
          Copy-Item "build\bin\Release\ReDroidCPP.exe" -Destination $deployDir
          Write-Host "[OK] Copied ReDroidCPP.exe"

          # ---------------------------------------------------------------
          # STEP 1: Run windeployqt
          # ---------------------------------------------------------------
          $env:QT_PLUGIN_PATH = "$env:QT_ROOT_DIR\plugins"
          $env:PATH = "$env:QT_ROOT_DIR\bin;$env:PATH"

          Write-Host "Running windeployqt..."
          & "$env:QT_ROOT_DIR\bin\windeployqt.exe" `
            --dir $deployDir `
            --no-translations `
            --force `
            "build\bin\Release\ReDroidCPP.exe"

          Write-Host "windeployqt exit code: $LASTEXITCODE"

          # ---------------------------------------------------------------
          # STEP 2: Explicitly copy Qt6 core DLLs (windeployqt backup)
          # windeployqt sometimes misses DLLs on CI - copy them manually
          # ---------------------------------------------------------------
          $qtBin = "$env:QT_ROOT_DIR\bin"
          $qtDllsToCopy = @(
            "Qt6Core.dll",
            "Qt6Gui.dll",
            "Qt6Widgets.dll",
            "Qt6Network.dll",
            "Qt6OpenGL.dll",
            "Qt6OpenGLWidgets.dll",
            "Qt6Svg.dll",
            "Qt6Xml.dll",
            "Qt6DBus.dll"
          )
          foreach ($dll in $qtDllsToCopy) {
            $src = "$qtBin\$dll"
            if (Test-Path $src) {
              Copy-Item $src -Destination $deployDir -Force
              Write-Host "  [OK] $dll"
            } else {
              Write-Host "  [SKIP] $dll (not present)"
            }
          }

          # ---------------------------------------------------------------
          # STEP 3: Qt plugins (CRITICAL - app won't start without these)
          # qwindows.dll must be at <exe_dir>/platforms/qwindows.dll
          # ---------------------------------------------------------------
          $pluginsDir = "$env:QT_ROOT_DIR\plugins"
          Write-Host "Qt plugins dir: $pluginsDir"

          # Copy ALL essential plugins
          $pluginsToCopy = @(
            "platforms",       # qwindows.dll - REQUIRED, app won't start without it
            "styles",          # Windows style
            "imageformats",    # PNG, JPG support
            "tls",             # SSL/TLS for network
            "networkinformation",
            "iconengines",
            "generic"
          )
          foreach ($plugin in $pluginsToCopy) {
            $src = "$pluginsDir\$plugin"
            if (Test-Path $src) {
              New-Item -ItemType Directory -Path "$deployDir\$plugin" -Force | Out-Null
              Copy-Item "$src\*" -Destination "$deployDir\$plugin" -Recurse -Force
              $count = (Get-ChildItem "$deployDir\$plugin").Count
              Write-Host "  [OK] $plugin ($count files)"
            } else {
              Write-Warning "  [MISSING] plugin dir: $src"
            }
          }

          # Verify qwindows.dll specifically
          $qwindows = "$deployDir\platforms\qwindows.dll"
          if (Test-Path $qwindows) {
            $size = [math]::Round((Get-Item $qwindows).Length / 1KB)
            Write-Host "  [VERIFIED] qwindows.dll ($size KB)"
          } else {
            Write-Error "CRITICAL: qwindows.dll not found at $qwindows"

            # Emergency: search entire Qt installation
            Write-Host "Searching Qt installation for qwindows.dll..."
            $found = Get-ChildItem "$env:QT_ROOT_DIR" -Filter "qwindows.dll" -Recurse `
                       -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($found) {
              New-Item -ItemType Directory -Path "$deployDir\platforms" -Force | Out-Null
              Copy-Item $found.FullName -Destination "$deployDir\platforms\" -Force
              Write-Host "  [RESCUED] qwindows.dll from $($found.FullName)"
            }
          }

          # ---------------------------------------------------------------
          # STEP 3b: Create qt.conf (plugin path config)
          # Note: main.cpp also calls addLibraryPath() as primary fix
          # ---------------------------------------------------------------
          $qtConfContent = "[Paths]`nPrefix = .`nPlugins = .`nLibraries = ."
          $qtConfContent | Out-File -FilePath "$deployDir\qt.conf" -Encoding ASCII
          Write-Host "  [OK] qt.conf created"

          # ---------------------------------------------------------------
          # STEP 4: MSVC Runtime DLLs
          # ---------------------------------------------------------------
          $vswhere = "C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -latest -products * -property installationPath 2>$null
          if (-not $vsPath) { $vsPath = "C:\Program Files\Microsoft Visual Studio\2022\Enterprise" }

          $crtDir = Get-ChildItem "$vsPath\VC\Redist\MSVC\*\x64\Microsoft.VC143.CRT" `
                      -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName

          $msvcDlls = @(
            "msvcp140.dll","msvcp140_1.dll","msvcp140_2.dll",
            "vcruntime140.dll","vcruntime140_1.dll","concrt140.dll"
          )
          foreach ($dll in $msvcDlls) {
            $src = if ($crtDir) { "$crtDir\$dll" } else { "C:\Windows\System32\$dll" }
            if (Test-Path $src) {
              Copy-Item $src -Destination $deployDir -Force
              Write-Host "  [OK] $dll"
            }
          }

          # ---------------------------------------------------------------
          # STEP 4b: Download and bundle scrcpy (30-60 FPS screen mirror)
          # Fetch the latest release tag dynamically so this step never
          # goes stale when a new scrcpy version is published.
          # ---------------------------------------------------------------
          Write-Host "Fetching latest scrcpy release..."
          try {
            $apiResponse  = Invoke-RestMethod `
              -Uri "https://api.github.com/repos/Genymobile/scrcpy/releases/latest" `
              -Headers @{ "User-Agent" = "redroid-cpp-ci" } `
              -TimeoutSec 30
            $scrcpyVersion = $apiResponse.tag_name          # e.g. "v4.1"
          } catch {
            # API unreachable — fall back to the last known-good version.
            $scrcpyVersion = "v4.1"
            Write-Warning "  GitHub API unavailable, falling back to $scrcpyVersion"
          }

          Write-Host "Downloading scrcpy $scrcpyVersion..."
          $scrcpyUrl = "https://github.com/Genymobile/scrcpy/releases/download/$scrcpyVersion/scrcpy-win64-$scrcpyVersion.zip"
          $scrcpyZip = "$env:TEMP\scrcpy.zip"
          $scrcpyDir = "$env:TEMP\scrcpy"

          try {
            Invoke-WebRequest -Uri $scrcpyUrl -OutFile $scrcpyZip -TimeoutSec 60
            Expand-Archive -Path $scrcpyZip -DestinationPath $scrcpyDir -Force

            $scrcpyExe = Get-ChildItem -Path $scrcpyDir -Filter "scrcpy.exe" -Recurse | Select-Object -First 1
            $scrcpyServer = Get-ChildItem -Path $scrcpyDir -Filter "scrcpy-server" -Recurse | Select-Object -First 1

            if ($scrcpyExe) {
              Copy-Item $scrcpyExe.FullName "$deployDir\scrcpy.exe" -Force
              Write-Host "  [OK] scrcpy.exe bundled ($scrcpyVersion)"
            }
            if ($scrcpyServer) {
              Copy-Item $scrcpyServer.FullName "$deployDir\scrcpy-server" -Force
              Write-Host "  [OK] scrcpy-server bundled ($scrcpyVersion)"
            }
          } catch {
            Write-Warning "  [SKIP] scrcpy download failed: $_"
            Write-Warning "  Screen mirror will use screencap fallback (5 FPS)"
          }

          # ---------------------------------------------------------------
          # STEP 4c: Download and bundle FFmpeg DLLs
          # DLL names carry FFmpeg major-version numbers (avutil-61 in 7.x,
          # avutil-62 in 8.x), so copy by LIBRARY NAME prefix instead of
          # hardcoding versions that go stale when BtbN drops old releases.
          # ---------------------------------------------------------------
          Write-Host "Downloading FFmpeg shared DLLs..."
          $ffmpegDir = "$env:TEMP\ffmpeg"
          $ffmpegZip = "$env:TEMP\ffmpeg.zip"

          # Resolve the download URL: GitHub API first, hardcoded fallbacks
          # second (the unauthenticated API is rate-limited and BtbN removes
          # old versioned assets, so fallbacks must be ones that always exist).
          $ffmpegUrl = $null
          try {
            $ffmpegApi = Invoke-RestMethod `
              -Uri "https://api.github.com/repos/BtbN/FFmpeg-Builds/releases/latest" `
              -Headers @{ "User-Agent" = "redroid-cpp-ci" } `
              -TimeoutSec 30

            # Prefer a stable nX.Y release build over the master build
            $ffmpegAsset = $ffmpegApi.assets | Where-Object {
              $_.name -match '^ffmpeg-n\d+\.\d+-latest-win64-lgpl-shared-[\d.]+\.zip$'
            } | Select-Object -First 1

            if (-not $ffmpegAsset) {
              $ffmpegAsset = $ffmpegApi.assets | Where-Object {
                $_.name -eq 'ffmpeg-master-latest-win64-lgpl-shared.zip'
              } | Select-Object -First 1
            }

            if ($ffmpegAsset) {
              $ffmpegUrl = $ffmpegAsset.browser_download_url
              Write-Host "  FFmpeg: $($ffmpegAsset.name)"
            } else {
              throw "No matching FFmpeg asset found"
            }
          } catch {
            Write-Warning "  GitHub API unavailable ($($_.Exception.Message)), using fallback URLs"
          }

          # Fallback candidates in order of stability
          if (-not $ffmpegUrl) {
            $ffmpegUrl = @(
              "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n8.1-latest-win64-lgpl-shared-8.1.zip",
              "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-lgpl-shared.zip"
            )
          } else {
            $ffmpegUrl = @($ffmpegUrl)
          }

          $downloaded = $false
          foreach ($url in $ffmpegUrl) {
            try {
              Write-Host "  Trying: $url"
              Invoke-WebRequest -Uri $url -OutFile $ffmpegZip -TimeoutSec 180
              Expand-Archive -Path $ffmpegZip -DestinationPath $ffmpegDir -Force
              $downloaded = $true
              break
            } catch {
              Write-Warning "  Download failed: $($_.Exception.Message)"
            }
          }

          if ($downloaded) {
            # Copy the DLL for each FFmpeg library, whatever its version suffix
            foreach ($lib in @("avutil", "avcodec", "swscale", "avformat", "swresample", "avfilter")) {
              $dll = Get-ChildItem -Path $ffmpegDir -Filter "$lib-*.dll" -Recurse |
                     Select-Object -First 1
              if ($dll) {
                Copy-Item $dll.FullName "$deployDir\$($dll.Name)" -Force
                Write-Host "  [OK] $($dll.Name)"
              } else {
                Write-Warning "  [SKIP] $lib-*.dll not found in FFmpeg package"
              }
            }
          } else {
            Write-Warning "  [SKIP] FFmpeg unavailable from all sources"
            Write-Warning "  Video features may not work without FFmpeg DLLs"
          }

          # ---------------------------------------------------------------
          # STEP 5: Final verification - FAIL build if anything missing
          # FFmpeg DLLs are NOT hard-required: their names depend on the
          # FFmpeg major version and the app compiles with a stub when
          # FFmpeg is absent, so only warn when they are missing.
          # ---------------------------------------------------------------
          Write-Host ""
          Write-Host "=== Final Verification ==="
          $required = @(
            "Qt6Core.dll",
            "Qt6Gui.dll",
            "Qt6Widgets.dll",
            "Qt6Network.dll",
            "Qt6OpenGL.dll",
            "platforms\qwindows.dll",
            "qt.conf"
          )
          $failed = $false
          foreach ($item in $required) {
            $exists = Test-Path "$deployDir\$item"
            if ($exists) {
              Write-Host "  [PASS] $item"
            } else {
              Write-Error "  [FAIL] $item MISSING"
              $failed = $true
            }
          }

          foreach ($lib in @("avutil", "avcodec", "swscale")) {
            if (Get-ChildItem -Path $deployDir -Filter "$lib-*.dll") {
              Write-Host "  [PASS] $lib-*.dll"
            } else {
              Write-Warning "  [WARN] $lib-*.dll MISSING - video decode will use the stub implementation"
            }
          }

          $totalFiles = (Get-ChildItem -Recurse $deployDir).Count
          Write-Host ""
          Write-Host "Total files in deploy: $totalFiles"
          $totalMB = [math]::Round((Get-ChildItem -Recurse $deployDir | Measure-Object -Property Length -Sum).Sum / 1MB, 2)
          Write-Host "Total size: $totalMB MB"

          if ($failed) { Write-Error "DEPLOYMENT FAILED"; exit 1 }
          Write-Host "=== Deployment Complete ==="

      - name: Run tests
        shell: pwsh
        run: cd build; ctest -C ${{ env.BUILD_TYPE }} --output-on-failure; exit 0

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: windows-exe
          path: build/bin/deploy/

  # ============================================================================
  # Code Quality
  # ============================================================================
  code-quality:
    name: Code Quality
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Run C++ static analysis
        run: |
          sudo apt-get install -y -qq cppcheck
          cppcheck --std=c++17 --suppress=missingInclude \
            --error-exitcode=1 src/ include/ 2>&1 | tail -30

  # ============================================================================
  # Security Scan
  # ============================================================================
  security-scan:
    name: Security Scan
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install and run Trivy security scanner
        run: |
          sudo apt-get install -y -qq wget gnupg
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key \
            | gpg --dearmor | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] \
            https://aquasecurity.github.io/trivy-repo/deb generic main" \
            | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update -qq && sudo apt-get install -y trivy
          trivy fs . --severity HIGH,CRITICAL --exit-code 1 \
            --no-progress --timeout 5m

