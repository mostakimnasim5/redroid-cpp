name: Build and Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  BUILD_TYPE: Release
  QT_VERSION: '6.7.3'

jobs:
  # ============================================================================
  # Linux Build
  # ============================================================================
  linux-build:
    name: Linux (Ubuntu 22.04)
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build g++ \
            libgl-dev libglu1-mesa-dev \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libssl-dev libdbus-1-dev \
            libegl-dev

      - name: Install Qt ${{ env.QT_VERSION }}
        run: |
          pip install aqtinstall --quiet
          python3 -m aqt install-qt linux desktop ${{ env.QT_VERSION }} linux_gcc_64 \
            --outputdir $HOME/Qt
          echo "$HOME/Qt/${{ env.QT_VERSION }}/gcc_64/bin" >> $GITHUB_PATH
          echo "CMAKE_PREFIX_PATH=$HOME/Qt/${{ env.QT_VERSION }}/gcc_64" >> $GITHUB_ENV

      - name: Configure CMake
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DBUILD_QT6_GUI=ON

      - name: Build project
        run: cmake --build build --parallel $(nproc)

      - name: Run tests
        run: cd build && ctest --output-on-failure || true

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: linux-build
          path: build/bin/

  # ============================================================================
  # Windows Build (MSVC 2022)
  # ============================================================================
  windows-build:
    name: Windows (VS 2022)
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Qt 6.8.2
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.2'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          cache: true
          cache-key-prefix: qt-win-6.8.2

      - name: Configure CMake
        shell: pwsh
        run: |
          cmake -B build `
            -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} `
            -DBUILD_QT6_GUI=ON `
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded

      - name: Build project
        shell: pwsh
        run: cmake --build build --config ${{ env.BUILD_TYPE }} --parallel

      - name: Deploy Qt6 Runtime with windeployqt
        shell: pwsh
        run: |
          # ========================================================================
          # Qt6 Deployment Step - Bundle all required DLLs and plugins
          # ========================================================================
          
          Write-Host "=== Starting Qt6 Deployment ==="
          Write-Host "Qt Root: $env:QT_ROOT_DIR"
          Write-Host "Qt Version: $env:QT_VERSION"
          
          # Create deployment directory
          $deployDir = "build\bin\deploy"
          if (Test-Path $deployDir) { Remove-Item -Recurse -Force $deployDir }
          New-Item -ItemType Directory -Path $deployDir | Out-Null
          
          # Copy the main executable
          Copy-Item "build\bin\Release\ReDroidCPP.exe" -Destination $deployDir
          Write-Host "[1/4] Copied ReDroidCPP.exe"
          
          # ========================================================================
          # Run windeployqt with CORRECT flags
          # ========================================================================
          # IMPORTANT: Do NOT use --no-compiler-runtime - Qt6 needs MSVC runtime!
          # IMPORTANT: Remove --no-opengl-sw - we need software OpenGL fallback
          
          $env:QT_PLUGIN_PATH = "$env:QT_ROOT_DIR\plugins"
          $env:PATH = "$env:QT_ROOT_DIR\bin;$env:PATH"
          
          Write-Host "[2/4] Running windeployqt.exe..."
          & "$env:QT_ROOT_DIR\bin\windeployqt.exe" `
            --dir $deployDir `
            --no-translations `
            --force `
            --verbose 2 `
            "build\bin\Release\ReDroidCPP.exe"
          
          if ($LASTEXITCODE -ne 0) {
            Write-Warning "windeployqt exited with code $LASTEXITCODE, trying fallback..."
          }
          
          # ========================================================================
          # Copy MSVC Runtime DLLs (CRITICAL - Qt6 requires these)
          # ========================================================================
          Write-Host "[3/4] Bundling MSVC Runtime DLLs..."
          
          # Find VS installation
          $vswhere = "C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -latest -products * -requires Microsoft.VisualCpp.Redist.14.Latest -property installationPath
          if (-not $vsPath) {
              $vsPath = "C:\Program Files\Microsoft Visual Studio\2022\Enterprise"
          }
          
          # Find VC++ Redistributables
          $crtPaths = @(
              "$vsPath\VC\Redist\MSVC\*\x64\Microsoft.VC143.CRT",
              "C:\Program Files\Microsoft Visual Studio\2022\Community\VC\Redist\MSVC\*\x64\Microsoft.VC143.CRT",
              "C:\Program Files\Microsoft Visual Studio\2022\BuildTools\VC\Redist\MSVC\*\x64\Microsoft.VC143.CRT"
          )
          
          $crtDir = $null
          foreach ($path in $crtPaths) {
              $found = Get-ChildItem $path -ErrorAction SilentlyContinue | Select-Object -First 1
              if ($found) {
                  $crtDir = $found.FullName
                  break
              }
          }
          
          Write-Host "VC++ CRT directory: $crtDir"
          
          # Copy ALL MSVC 2022 runtime DLLs
          $msvcDlls = @(
              "msvcp140.dll",
              "msvcp140_1.dll",
              "msvcp140_2.dll",
              "vcruntime140.dll",
              "vcruntime140_1.dll",
              "concrt140.dll",
              "vccorlib140.dll"
          )
          
          foreach ($dll in $msvcDlls) {
              $src = Join-Path $crtDir $dll
              if (Test-Path $src) {
                  Copy-Item $src -Destination $deployDir
                  Write-Host "  [OK] $dll"
              } else {
                  # Try System32 as fallback
                  $sys32src = "C:\Windows\System32\$dll"
                  if (Test-Path $sys32src) {
                      Copy-Item $sys32src -Destination $deployDir
                      Write-Host "  [OK] $dll (from System32)"
                  } else {
                      Write-Warning "  [MISSING] $dll"
                  }
              }
          }
          
          # ========================================================================
          # Verify deployment
          # ========================================================================
          Write-Host "[4/4] Verifying deployment..."
          Write-Host ""
          Write-Host "=== Deployed Files ==="
          
          $dlls = Get-ChildItem -Path $deployDir -Filter "*.dll" | Select-Object Name
          $qtDlls = $dlls | Where-Object { $_.Name -like "Qt6*" }
          $msvcDlls = $dlls | Where-Object { $_.Name -like "MSVC*" -or $_.Name -like "vcruntime*" -or $_.Name -like "msvcp*" }
          
          Write-Host ""
          Write-Host "Qt6 DLLs deployed: $($qtDlls.Count)"
          $qtDlls | ForEach-Object { Write-Host "  - $($_.Name)" }
          
          Write-Host ""
          Write-Host "MSVC Runtime DLLs deployed: $($msvcDlls.Count)"
          $msvcDlls | ForEach-Object { Write-Host "  - $($_.Name)" }
          
          Write-Host ""
          Write-Host "Total files deployed:"
          (Get-ChildItem -Recurse $deployDir).Count
          
          # Check for required Qt6 DLLs
          $requiredQt6 = @("Qt6Core.dll", "Qt6Gui.dll", "Qt6Widgets.dll", "Qt6Network.dll")
          foreach ($dll in $requiredQt6) {
              if (-not (Test-Path "$deployDir\$dll")) {
                  Write-Error "CRITICAL: Missing $dll"
              }
          }
          
          Write-Host ""
          Write-Host "=== Deployment Complete ==="

      - name: Run tests
        shell: pwsh
        run: cd build; ctest -C ${{ env.BUILD_TYPE }} --output-on-failure; exit 0

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: windows-exe
          path: build/bin/deploy/

  # ============================================================================
  # Code Quality
  # ============================================================================
  code-quality:
    name: Code Quality
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Run C++ static analysis
        run: |
          sudo apt-get install -y -qq cppcheck
          cppcheck --std=c++17 --suppress=missingInclude \
            --error-exitcode=0 src/ include/ 2>&1 | tail -10 || true

  # ============================================================================
  # Security Scan
  # ============================================================================
  security-scan:
    name: Security Scan
    runs-on: ubuntu-22.04
    continue-on-error: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install and run Trivy security scanner
        run: |
          sudo apt-get install -y -qq wget gnupg
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key \
            | gpg --dearmor | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] \
            https://aquasecurity.github.io/trivy-repo/deb generic main" \
            | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update -qq && sudo apt-get install -y trivy
          trivy fs . --severity HIGH,CRITICAL --exit-code 0 \
            --no-progress --timeout 5m || true

