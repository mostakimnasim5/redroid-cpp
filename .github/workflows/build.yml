name: Build and Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  BUILD_TYPE: Release
  QT_VERSION: '6.7.3'

jobs:
  # ============================================================================
  # Linux Build
  # ============================================================================
  linux-build:
    name: Linux (Ubuntu 22.04)
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build g++ \
            libgl-dev libglu1-mesa-dev \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libssl-dev libdbus-1-dev \
            libegl-dev

      - name: Install Qt ${{ env.QT_VERSION }}
        run: |
          pip install aqtinstall --quiet
          python3 -m aqt install-qt linux desktop ${{ env.QT_VERSION }} linux_gcc_64 \
            --outputdir $HOME/Qt
          echo "$HOME/Qt/${{ env.QT_VERSION }}/gcc_64/bin" >> $GITHUB_PATH
          echo "CMAKE_PREFIX_PATH=$HOME/Qt/${{ env.QT_VERSION }}/gcc_64" >> $GITHUB_ENV

      - name: Configure CMake
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DBUILD_QT6_GUI=ON

      - name: Build project
        run: cmake --build build --parallel $(nproc)

      - name: Run tests
        run: cd build && ctest --output-on-failure || true

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: linux-build
          path: build/bin/

  # ============================================================================
  # Windows Build (MSVC 2022)
  # ============================================================================
  windows-build:
    name: Windows (VS 2022)
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Qt 6.8.2
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.2'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          cache: true
          cache-key-prefix: qt-win-6.8.2

      - name: Configure CMake
        shell: pwsh
        run: |
          cmake -B build `
            -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_BUILD_TYPE=Release `
            -DBUILD_QT6_GUI=ON `
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded

      - name: Build project
        shell: pwsh
        run: cmake --build build --config Release --parallel

      - name: Deploy Qt6 Runtime with windeployqt
        shell: pwsh
        run: |
          Write-Host "=== Qt6 Deployment Starting ==="
          Write-Host "Qt Root Dir: $env:QT_ROOT_DIR"

          # Validate Qt installation
          if (-not $env:QT_ROOT_DIR -or -not (Test-Path "$env:QT_ROOT_DIR\bin\windeployqt.exe")) {
            # Try to find Qt manually
            $qtSearch = Get-ChildItem "C:\Qt\*\msvc2022_64\bin\windeployqt.exe" `
                          -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($qtSearch) {
              $env:QT_ROOT_DIR = Split-Path (Split-Path $qtSearch.FullName)
              Write-Host "Found Qt at: $env:QT_ROOT_DIR"
            } else {
              Write-Error "Qt installation not found!"
              exit 1
            }
          }

          # Create deploy directory
          $deployDir = "build\bin\deploy"
          if (Test-Path $deployDir) { Remove-Item -Recurse -Force $deployDir }
          New-Item -ItemType Directory -Path $deployDir | Out-Null

          # Copy exe
          Copy-Item "build\bin\Release\ReDroidCPP.exe" -Destination $deployDir
          Write-Host "[OK] Copied ReDroidCPP.exe"

          # ---------------------------------------------------------------
          # STEP 1: Run windeployqt
          # ---------------------------------------------------------------
          $env:QT_PLUGIN_PATH = "$env:QT_ROOT_DIR\plugins"
          $env:PATH = "$env:QT_ROOT_DIR\bin;$env:PATH"

          Write-Host "Running windeployqt..."
          & "$env:QT_ROOT_DIR\bin\windeployqt.exe" `
            --dir $deployDir `
            --no-translations `
            --force `
            "build\bin\Release\ReDroidCPP.exe"

          Write-Host "windeployqt exit code: $LASTEXITCODE"

          # ---------------------------------------------------------------
          # STEP 2: Explicitly copy Qt6 core DLLs (windeployqt backup)
          # windeployqt sometimes misses DLLs on CI - copy them manually
          # ---------------------------------------------------------------
          $qtBin = "$env:QT_ROOT_DIR\bin"
          $qtDllsToCopy = @(
            "Qt6Core.dll",
            "Qt6Gui.dll",
            "Qt6Widgets.dll",
            "Qt6Network.dll",
            "Qt6OpenGL.dll",
            "Qt6OpenGLWidgets.dll",
            "Qt6Svg.dll",
            "Qt6Xml.dll",
            "Qt6DBus.dll"
          )
          foreach ($dll in $qtDllsToCopy) {
            $src = "$qtBin\$dll"
            if (Test-Path $src) {
              Copy-Item $src -Destination $deployDir -Force
              Write-Host "  [OK] $dll"
            } else {
              Write-Host "  [SKIP] $dll (not present)"
            }
          }

          # ---------------------------------------------------------------
          # STEP 3: Qt plugins (critical for GUI to start)
          # ---------------------------------------------------------------
          $pluginsDir = "$env:QT_ROOT_DIR\plugins"
          $pluginsToCopy = @("platforms", "styles", "imageformats", "tls", "networkinformation")
          foreach ($plugin in $pluginsToCopy) {
            $src = "$pluginsDir\$plugin"
            if (Test-Path $src) {
              Copy-Item $src -Destination "$deployDir\$plugin" -Recurse -Force
              Write-Host "  [OK] plugin: $plugin"
            }
          }

          # ---------------------------------------------------------------
          # STEP 4: MSVC Runtime DLLs
          # ---------------------------------------------------------------
          $vswhere = "C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -latest -products * -property installationPath 2>$null
          if (-not $vsPath) { $vsPath = "C:\Program Files\Microsoft Visual Studio\2022\Enterprise" }

          $crtDir = Get-ChildItem "$vsPath\VC\Redist\MSVC\*\x64\Microsoft.VC143.CRT" `
                      -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName

          $msvcDlls = @(
            "msvcp140.dll","msvcp140_1.dll","msvcp140_2.dll",
            "vcruntime140.dll","vcruntime140_1.dll","concrt140.dll"
          )
          foreach ($dll in $msvcDlls) {
            $src = if ($crtDir) { "$crtDir\$dll" } else { "C:\Windows\System32\$dll" }
            if (Test-Path $src) {
              Copy-Item $src -Destination $deployDir -Force
              Write-Host "  [OK] $dll"
            }
          }

          # ---------------------------------------------------------------
          # STEP 5: Final verification - FAIL build if Qt DLLs missing
          # ---------------------------------------------------------------
          Write-Host ""
          Write-Host "=== Verification ==="
          $required = @("Qt6Core.dll","Qt6Gui.dll","Qt6Widgets.dll","Qt6Network.dll","platforms")
          $failed = $false
          foreach ($item in $required) {
            $exists = Test-Path "$deployDir\$item"
            if ($exists) {
              Write-Host "  [PASS] $item"
            } else {
              Write-Error "  [FAIL] $item MISSING"
              $failed = $true
            }
          }

          $totalFiles = (Get-ChildItem -Recurse $deployDir).Count
          Write-Host ""
          Write-Host "Total files in deploy: $totalFiles"
          $totalMB = [math]::Round((Get-ChildItem -Recurse $deployDir | Measure-Object -Property Length -Sum).Sum / 1MB, 2)
          Write-Host "Total size: $totalMB MB"

          if ($failed) { Write-Error "DEPLOYMENT FAILED"; exit 1 }
          Write-Host "=== Deployment Complete ==="

      - name: Run tests
        shell: pwsh
        run: cd build; ctest -C ${{ env.BUILD_TYPE }} --output-on-failure; exit 0

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: windows-exe
          path: build/bin/deploy/

  # ============================================================================
  # Code Quality
  # ============================================================================
  code-quality:
    name: Code Quality
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Run C++ static analysis
        run: |
          sudo apt-get install -y -qq cppcheck
          cppcheck --std=c++17 --suppress=missingInclude \
            --error-exitcode=0 src/ include/ 2>&1 | tail -10 || true

  # ============================================================================
  # Security Scan
  # ============================================================================
  security-scan:
    name: Security Scan
    runs-on: ubuntu-22.04
    continue-on-error: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install and run Trivy security scanner
        run: |
          sudo apt-get install -y -qq wget gnupg
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key \
            | gpg --dearmor | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] \
            https://aquasecurity.github.io/trivy-repo/deb generic main" \
            | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update -qq && sudo apt-get install -y trivy
          trivy fs . --severity HIGH,CRITICAL --exit-code 0 \
            --no-progress --timeout 5m || true

