# ==============================================================================
# ReDroidCPP - ReDroid Docker Compose
# Uses lightweight ReDroid (Real Docker Android) container
# Windows-optimized: KVM disabled, swiftshader GPU
# ==============================================================================

services:
  android-emulator:
    build:
      context: ..
      dockerfile: docker/Dockerfile.custom
    container_name: android-emulator
    image: redroid-cpp/android-emulator:latest
    hostname: android-emulator
    
    # Privileged mode is REQUIRED for ReDroid - do not remove
    privileged: true
    
    # KVM: Linux-only hardware acceleration — disabled for Windows
    # To enable on Linux: uncomment the devices section below
    # devices:
    #   - /dev/kvm:/dev/kvm
    #   - /dev/fuse:/dev/fuse

    environment:
      # GPU Mode: swiftshader = software rendering (Windows compatible)
      # Change to 'host' only on Linux with GPU passthrough
      - REDROID_GPU_MODE=swiftshader
      # Memory: 512M minimum, 2G recommended for smooth performance
      - REDROID_MEM_SIZE=2G
      # KVM disabled — not available on Windows
      # REDROID_VGPU=KVM  ← removed: causes boot failure on Windows

    ports:
      - "5555:5555"  # ADB

    healthcheck:
      test: ["CMD", "getprop", "sys.boot_completed"]
      interval: 30s
      timeout: 10s
      retries: 15
      start_period: 60s

    restart: "no"

volumes:
  device_data:
