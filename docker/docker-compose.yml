# ==============================================================================
# ReDroidCPP - Docker Compose (Reference / Manual Testing)
#
# NOTE: The ReDroidCPP GUI uses "docker run" directly to create instances.
# This file is for manual testing only, not used by the software itself.
#
# Manual usage:
#   CONTAINER_NAME=test-1 ADB_PORT=5555 docker compose up -d
#
# Requirements:
# - WSL2 with custom kernel (binder module)
# - Docker Desktop with WSL2 backend
# ==============================================================================

services:
  android-emulator:
    image: redroid/redroid:14.0.0-latest
    container_name: ${CONTAINER_NAME:-redroid-test}
    hostname: ${CONTAINER_NAME:-redroid-test}
    privileged: true

    # Binder devices (WSL2 custom kernel required)
    devices:
      - /dev/binder:/dev/binder
      - /dev/vndbinder:/dev/vndbinder
      - /dev/hwbinder:/dev/hwbinder

    environment:
      - REDROID_MEM_SIZE=${REDROID_MEM_SIZE:-1536M}
      - REDROID_RAM_SIZE=${REDROID_RAM_SIZE:-1536}
      - REDROID_GPU_MODE=${REDROID_GPU_MODE:-swiftshader}

    ports:
      - "127.0.0.1:${ADB_PORT:-5555}:5555"

    healthcheck:
      test: ["CMD", "getprop", "sys.boot_completed"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

    deploy:
      resources:
        limits:
          memory: ${REDROID_MEM_SIZE:-1536M}
        reservations:
          memory: 512M

    restart: unless-stopped
