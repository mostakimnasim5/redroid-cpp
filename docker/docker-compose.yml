# ==============================================================================
# ReDroidCPP - ReDroid Docker Compose
#
# Requirements:
# - WSL2 with custom kernel (binder module)
# - Docker Desktop with WSL2 backend
#
# Setup: Run installer first to configure WSL2 kernel
# ==============================================================================

services:
  android-emulator:
    build:
      context: ..
      dockerfile: docker/Dockerfile.custom
    container_name: ${CONTAINER_NAME:-redroid-instance-1}
    image: redroid-cpp/redroid:latest
    hostname: ${CONTAINER_NAME:-redroid-instance-1}

    # REQUIRED for ReDroid
    privileged: true

    # Binder devices - available after WSL2 custom kernel install
    devices:
      - /dev/binder:/dev/binder
      - /dev/vndbinder:/dev/vndbinder
      - /dev/hwbinder:/dev/hwbinder

    environment:
      - REDROID_MEM_SIZE=${REDROID_MEM_SIZE:-1536M}
      - REDROID_RAM_SIZE=${REDROID_RAM_SIZE:-1536}
      - REDROID_GPU_MODE=${REDROID_GPU_MODE:-swiftshader}
      - REDROID_NET_HOSTNAME=${CONTAINER_NAME:-redroid-instance-1}
      - ADB_PORT=5555

    # ADB port - dynamic per instance
    ports:
      - "127.0.0.1:${ADB_PORT:-5555}:5555"

    volumes:
      - ${CONTAINER_NAME:-redroid-instance-1}-data:/data

    healthcheck:
      test: ["CMD", "getprop", "sys.boot_completed"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

    deploy:
      resources:
        limits:
          memory: ${REDROID_MEM_SIZE:-1536M}
        reservations:
          memory: 512M

    restart: unless-stopped

volumes:
  redroid-instance-1-data:
