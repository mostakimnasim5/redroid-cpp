# ==============================================================================
# ReDroidCPP - Pure ReDroid Docker Compose
# 
# Features:
# - Pure ReDroid container (NO QEMU/AVD)
# - Dynamic memory configuration (1GB, 1.5GB, 2GB)
# - Fast boot (<3 seconds target)
# - Low RAM usage (~1GB-1.5GB)
#
# Usage:
#   docker compose up -d
#
# Environment Variables:
#   REDROID_MEM_SIZE - Container memory (default: 1536M)
#   REDROID_GPU_MODE - swiftshader (default), host, auto
#   REDROID_RAM_SIZE  - Internal RAM size (default: 1536)
# ==============================================================================

services:
  android-emulator:
    build:
      context: ..
      dockerfile: docker/Dockerfile.custom
    container_name: redroid-emulator
    image: redroid-cpp/redroid:latest
    hostname: redroid-emulator
    
    # Privileged mode REQUIRED for ReDroid
    privileged: true
    
    # KVM access for hardware acceleration (Linux only)
    # On Windows/others: these will be skipped if not available
    devices:
      - /dev/kvm:/dev/kvm
      - /dev/binderfs/binder:/dev/binder
      - /dev/binder:/dev/binder
      - /dev/vndbinder:/dev/vndbinder
      - /dev/hwbinder:/dev/hwbinder

    environment:
      # ===== MEMORY CONFIGURATION (Dynamic) =====
      # User can override: 1024M, 1536M, 2048M, 3072M
      - REDROID_MEM_SIZE=${REDROID_MEM_SIZE:-1536M}
      # Internal RAM size for Android
      - REDROID_RAM_SIZE=${REDROID_RAM_SIZE:-1536}
      
      # ===== GPU CONFIGURATION =====
      # Options: swiftshader (default, no GPU), host (hardware GPU), auto
      - REDROID_GPU_MODE=${REDROID_GPU_MODE:-swiftshader}
      
      # ===== NETWORK =====
      - REDROID_NET_HOSTNAME=redroid-emulator
      
      # ===== ADB =====
      - ADB_PORT=5555

    ports:
      - "5555:5555"  # ADB

    volumes:
      # Mount configs for device spoofing
      - ./configs:/opt/redroid/configs:ro
      
    healthcheck:
      test: ["CMD", "getprop", "sys.boot_completed"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

    # Resource limits
    deploy:
      resources:
        limits:
          memory: ${REDROID_MEM_SIZE:-1536M}
        reservations:
          memory: 512M

    # Auto-restart on crash (optional)
    restart: unless-stopped

volumes:
  redroid-data:
